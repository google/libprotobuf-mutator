syntax = "proto2";

package protobuf_mutator.macro_drivers;

// Light schema for exercising the libFuzzer macro driver layer
// (src/libfuzzer/libfuzzer_macro.cc) and the LLVMFuzzerMutate-backed
// mutator subclass (src/libfuzzer/libfuzzer_mutator.cc): every scalar
// cpp type present so each Mutate* override gets instantiated, plus a
// repeated field and a proto2 enum for sampler coverage.

message Msg {
  enum Kind {
    K0 = 0;
    K1 = 1;
    K2 = 2;
  }

  optional int32 i32 = 1;
  optional uint32 u32 = 2;
  optional uint64 u64 = 3;
  optional double f64 = 4;
  optional bool b = 5;
  optional string s = 6;
  repeated int64 rep_i64 = 7;
  optional Kind kind = 8;
}
